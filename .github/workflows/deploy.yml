name: Build prices and deploy

# Nightly: download TCGCSV once, build the card catalog, publish the site.
# Also runs on every push to main, and by hand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "43 2 * * *"   # 02:43 UTC = 9:43 PM Eastern (10:43 PM in summer); TCGCSV refreshes ~20:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # keepalive commit only
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog from TCGCSV
        run: python3 sync/build_catalog.py site/catalog

      - name: Check every game built
        run: |
          python3 - <<'EOF'
          import json, sys
          m = json.load(open("site/catalog/manifest.json"))
          bad = [k for k, g in m["games"].items() if g.get("error") or not g.get("products")]
          print({k: g.get("products") for k, g in m["games"].items()})
          if bad:
              sys.exit(f"Not deploying: these games failed to build: {bad}. Yesterday's site stays live.")
          EOF
          rm -f site/catalog/publish_files.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub pauses scheduled jobs after 60 days with no commits; a tiny commit every ~50 days prevents that.
      - name: Keep the nightly schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "card-desk-bot"
            git config user.email "card-desk-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep nightly price updates running [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
