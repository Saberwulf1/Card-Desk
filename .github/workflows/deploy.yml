name: Build prices and deploy

# Daily at 6 AM Eastern: download TCGCSV once, build the card catalog, publish the site.
# Also runs on every push to main, and by hand from the Actions tab.
# After every run a notification says whether the price update worked and whether prices changed.
on:
  push:
    branches: [main]
  schedule:
    # GitHub often starts scheduled runs hours late, so the morning is covered by hourly tries (UTC times):
    # 10:17 … 16:17 UTC = 6:17 AM … 12:17 PM EDT (summer) or 5:17 AM … 11:17 AM EST (winter).
    # The gate job runs the build at the first try after 6 AM New York time that finds new TCGCSV prices,
    # and skips the rest. If TCGCSV has nothing new, the first try from 11 AM runs anyway, so you still
    # get the daily "prices didn't change" notice.
    - cron: "17 10-16 * * *"
  workflow_dispatch:

permissions:
  contents: write   # keepalive commit only
  pages: write
  id-token: write
  issues: write     # notification comments

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$EVENT" != schedule ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          SITE="https://${OWNER,,}.github.io/${REPO}/" python3 - <<'PY'
          import datetime as dt, json, os, urllib.request, zoneinfo
          ny = zoneinfo.ZoneInfo("America/New_York"); now = dt.datetime.now(ny)
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "CardDesk-gate/1.0"}), timeout=30) as r:
                  return r.read().decode()
          run, why = True, ""
          if now.hour < 6:
              run, why = False, "before 6 AM in New York"
          else:
              try:
                  src = get("https://tcgcsv.com/last-updated.txt").strip()
                  live = json.loads(get(os.environ["SITE"] + f"catalog/manifest.json?t={int(now.timestamp())}"))
                  ran_today = dt.datetime.fromtimestamp((live.get("updateAt") or live["builtAt"]) / 1000, ny).date() == now.date()
                  if live.get("tcgcsvUpdated") != src:
                      why = f"new TCGCSV prices ({src})"
                  elif ran_today:
                      run, why = False, "already updated today with the latest TCGCSV prices"
                  elif now.hour >= 11:
                      why = "no new TCGCSV prices yet; running anyway so today's notice goes out"
                  else:
                      run, why = False, f"TCGCSV hasn't updated since {src}; will try again next hour"
              except Exception as e:
                  why = f"couldn't check ({e}); running to be safe"
          print(f"{now:%a %H:%M} New York: run={run} ({why})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={'true' if run else 'false'}\n")
          PY

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      count: ${{ steps.check.outputs.count }}
      summary: ${{ steps.check.outputs.summary }}
      errors: ${{ steps.check.outputs.errors }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build catalog from TCGCSV
        env:
          PREV_SITE: ${{ steps.pages.outputs.base_url }}   # compare with the prices live now
        run: python3 sync/build_catalog.py site/catalog

      # Price history for the stock value chart. Never stops the deploy (keeps the live copy on errors).
      - name: Price history
        env:
          PREV_SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          pip install --quiet py7zr || echo "py7zr not installed; history keeps the live copy"
          python3 sync/build_history.py site/catalog

      - name: Check every game built
        id: check
        run: |
          python3 - <<'EOF'
          import json, os, sys
          m = json.load(open("site/catalog/manifest.json"))
          bad = [k for k, g in m["games"].items() if g.get("error") or not g.get("products")]
          print({k: g.get("products") for k, g in m["games"].items()})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"changed={json.dumps(m.get('changed'))}\n")
              out.write(f"count={m.get('changedCount') or 0}\n")
              out.write("summary=" + ", ".join(f"{g['label']} {g.get('products') or 0:,}" for g in m["games"].values()) + "\n")
              out.write(f"errors={'' if m.get('ok') else 'some sets failed to download'}\n")
          if bad:
              sys.exit(f"Not deploying: these games failed to build: {bad}. Yesterday's site stays live.")
          EOF
          rm -f site/catalog/publish_files.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub pauses scheduled jobs after 60 days with no commits; a tiny commit every ~50 days prevents that.
      - name: Keep the nightly schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "card-desk-bot"
            git config user.email "card-desk-bot@users.noreply.github.com"
            git commit --allow-empty -m "Keep nightly price updates running [skip ci]"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A comment on the "Price update notifications" issue after every run, @mentioning the owner,
  # so GitHub sends an email / mobile push. If a NTFY_TOPIC secret is set, also a push via ntfy.sh.
  notify:
    needs: [gate, build, deploy]
    if: always() && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          CHANGED: ${{ needs.build.outputs.changed }}
          COUNT: ${{ needs.build.outputs.count }}
          SUMMARY: ${{ needs.build.outputs.summary }}
          ERRORS: ${{ needs.build.outputs.errors }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          when=$(TZ=America/New_York date '+%a %b %-d, %-I:%M %p ET')
          case "$EVENT" in schedule) why="daily update";; push) why="update after a code push";; *) why="update run by hand";; esac
          if [ "$BUILD" = success ] && [ "$DEPLOY" = success ]; then
            if [ "$CHANGED" = false ]; then
              title="⚠️ Card Desk: prices didn't change"
              body="The price $why ran ($when) but no prices changed from the previous update. TCGCSV may not have refreshed yet."
              tags=warning
            else
              title="✅ Card Desk: prices updated"
              if [ "$CHANGED" = true ]; then body="Price $why succeeded ($when): ${COUNT} prices changed."; else body="Price $why succeeded ($when)."; fi
              tags=white_check_mark
            fi
            [ -n "$ERRORS" ] && body="$body Note: $ERRORS."
            body="$body Cards: $SUMMARY."
          else
            title="❌ Card Desk: price update failed"
            if [ "$BUILD" != success ]; then step="building prices"; else step="publishing the site"; fi
            body="The price $why failed while $step ($when). Yesterday's prices stay live."
            tags=x
          fi
          echo "$title — $body"

          num=$(gh issue list --state open --search 'in:title "Price update notifications"' --json number -q '.[0].number')
          if [ -z "$num" ]; then
            url=$(gh issue create --title "Price update notifications" --body "Card Desk posts a comment here after every price update, so you get a GitHub notification. Unsubscribe or close this issue to stop.")
            num=${url##*/}
          fi
          gh issue comment "$num" --body "**$title**

          $body

          [Run details]($RUN_URL) · @$OWNER"

          if [ -n "$NTFY_TOPIC" ]; then
            curl -fsS -H "Title: ${title#* }" -H "Tags: $tags" -H "Click: $RUN_URL" -d "$body" "https://ntfy.sh/$NTFY_TOPIC" || true
          fi
